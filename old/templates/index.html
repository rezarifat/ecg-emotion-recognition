<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECG Emotion Detector</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
  .hero { background: linear-gradient(135deg, #2980b9, #6dd5fa); color: white;
          padding: 40px 0; text-align: center; margin-bottom: 30px; }
  .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .upload-area { border: 2px dashed #2980b9; border-radius: 12px; padding: 40px;
                 text-align: center; cursor: pointer; transition: 0.2s; background: #f8fbff; }
  .upload-area:hover { background: #e8f4fd; }
  .emotion-display { font-size: 2.5rem; font-weight: 700; color: #2980b9; }
  .prob-bar { height: 22px; border-radius: 6px; transition: width 0.6s ease; min-width: 4px; }
  .hrv-table td { padding: 8px 12px; }
  .hrv-table tr:nth-child(even) { background: #f8f9fa; }
  #spinner { display: none; }
</style>
</head>
<body>

<div class="hero">
  <h1>❤️ ECG Emotion Detector</h1>
  <p class="mb-0">Upload an ECG CSV file to detect emotional state using deep learning</p>
</div>

<div class="container pb-5" style="max-width:750px">

  <!-- Upload Card -->
  <div class="card p-4 mb-4">
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div style="font-size:2.5rem">📂</div>
      <h5 class="mt-2">Click to upload ECG CSV file</h5>
      <p class="text-muted small">Upload a DICOM (.dcm) or CSV (.csv) ECG file</p>
      <input type="file" id="fileInput" accept=".dcm,.csv" style="display:none" onchange="handleFile(this)">
    </div>
    <div id="fileName" class="text-center text-muted mt-2 small"></div>
    <button id="analyseBtn" class="btn btn-primary w-100 mt-3" onclick="uploadFile()" disabled>
      Analyse ECG
    </button>
    <div id="spinner" class="text-center mt-3">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2 text-muted">Analysing ECG signal...</p>
    </div>
  </div>

  <!-- Results Card (hidden until result) -->
  <div id="resultCard" class="card p-4 d-none">

    <h5 class="mb-3">🧠 Detected Emotion</h5>
    <div class="text-center mb-2">
      <div class="emotion-display" id="emotionLabel"></div>
      <div class="text-muted" id="confidenceLabel"></div>
      <div class="text-muted fst-italic small mt-1" id="descLabel"></div>
    </div>

    <hr>
    <h6 class="mb-3">📊 Emotion Probabilities</h6>
    <div id="probBars" class="mb-3"></div>

    <hr>
    <h6 class="mb-3">💓 HRV Features</h6>
    <table class="hrv-table w-100" id="hrvTable"></table>

    <hr>
    <a href="/report" class="btn btn-success w-100">
      📄 Download PDF Report
    </a>
  </div>

</div>

<script>
const BAR_COLORS = {
  "Happy/Excited":  "#F1C40F",
  "Angry/Stressed": "#E74C3C",
  "Calm/Relaxed":   "#2ECC71",
  "Sad/Bored":      "#3498DB"
};

function handleFile(input) {
  const file = input.files[0];
  if (file) {
    document.getElementById('fileName').textContent = `Selected: ${file.name}`;
    document.getElementById('analyseBtn').disabled = false;
  }
}

async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;

  document.getElementById('spinner').style.display = 'block';
  document.getElementById('analyseBtn').disabled = true;
  document.getElementById('resultCard').classList.add('d-none');

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res  = await fetch("/predict", { method: "POST", body: formData });
    const data = await res.json();

    if (data.error) {
      alert("Error: " + data.error);
      return;
    }

    // Emotion result
    document.getElementById("emotionLabel").textContent = `${data.emoji} ${data.emotion}`;
    document.getElementById("confidenceLabel").textContent = `Confidence: ${data.confidence}%`;
    document.getElementById("descLabel").textContent = data.description;

    // Probability bars
    document.getElementById("probBars").innerHTML = Object.entries(data.all_probs).map(([e, p]) => `
      <div class="mb-2">
        <div class="d-flex justify-content-between small mb-1">
          <span>${e}</span><span><b>${p}%</b></span>
        </div>
        <div style="background:#eee; border-radius:6px; height:22px">
          <div class="prob-bar" style="width:${p}%; background:${BAR_COLORS[e]}"></div>
        </div>
      </div>`).join("");

    // HRV table
    document.getElementById("hrvTable").innerHTML =
      Object.entries(data.hrv_features).map(([k, v], i) => `
        <tr style="${i%2===0?'background:#f8f9fa':''}">
          <td class="text-muted">${k}</td>
          <td><b>${v}</b></td>
        </tr>`).join("");

    document.getElementById("resultCard").classList.remove("d-none");

  } catch(e) {
    alert("Something went wrong: " + e.message);
  } finally {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('analyseBtn').disabled = false;
  }
}
</script>
</body>
</html>
